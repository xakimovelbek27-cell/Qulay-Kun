<style>
:root{--bg1:#eef2ff;--bg2:#fdf2f8;--card:rgba(255,255,255,.7);--tx:#1e1b3a;--mut:#6f6b8f;--bd:rgba(255,255,255,.95);--sh:0 8px 28px rgba(99,102,241,.14);--c1:#6366f1;--c2:#ec4899;--c3:#06b6d4;--c4:#f59e0b;--ok:#10b981;--track:rgba(99,102,241,.14);--a:#6366f1;--b:#ec4899;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root{--bg1:#0d0b21;--bg2:#1c1038;--card:rgba(40,34,80,.62);--tx:#f1f0ff;--mut:#a29fc6;--bd:rgba(255,255,255,.08);--sh:0 8px 28px rgba(0,0,0,.35);--track:rgba(255,255,255,.1)}}
html[data-theme="light"]{--bg1:#eef2ff;--bg2:#fdf2f8;--card:rgba(255,255,255,.7);--tx:#1e1b3a;--mut:#6f6b8f;--bd:rgba(255,255,255,.95);--sh:0 8px 28px rgba(99,102,241,.14);--track:rgba(99,102,241,.14)}
html[data-theme="dark"]{--bg1:#0d0b21;--bg2:#1c1038;--card:rgba(40,34,80,.62);--tx:#f1f0ff;--mut:#a29fc6;--bd:rgba(255,255,255,.08);--sh:0 8px 28px rgba(0,0,0,.35);--track:rgba(255,255,255,.1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));background-attachment:fixed;color:var(--tx);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
body::before,body::after{content:"";position:fixed;width:300px;height:300px;border-radius:50%;filter:blur(70px);opacity:.45;z-index:0;pointer-events:none;animation:fl 12s ease-in-out infinite alternate}
body::before{background:var(--a);top:-80px;left:-80px}
body::after{background:var(--b);bottom:-90px;right:-80px;animation-delay:-6s}
@keyframes fl{to{transform:translate(50px,60px) scale(1.2)}}
main{flex:1;overflow-y:auto;padding:18px 16px 120px;max-width:600px;width:100%;margin:0 auto;position:relative;z-index:1}
main.an>*{animation:up .45s both}main.an>*:nth-child(2){animation-delay:.05s}main.an>*:nth-child(3){animation-delay:.1s}main.an>*:nth-child(4){animation-delay:.15s}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
h1{margin:0;font-size:30px;font-weight:800;background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{margin:0 0 10px;font-size:18px}
.sub{color:var(--mut);margin:2px 0 18px}
.card{background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--bd);box-shadow:var(--sh);border-radius:24px;padding:16px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1}
input[type=text],input[type=number],input[type=time]{width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:16px;outline:0;box-shadow:var(--sh)}
input[type=text]:focus,input[type=number]:focus,input[type=time]:focus{border-color:var(--a)}
button{font:inherit;font-weight:600;border:0;border-radius:16px;padding:12px 18px;background:linear-gradient(135deg,var(--a),var(--b));color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(99,102,241,.3);transition:transform .15s}
button:active{transform:scale(.93)}
button.g{background:var(--card);color:var(--tx);border:1px solid var(--bd);box-shadow:none}
button.x{background:none;color:var(--mut);padding:6px 10px;box-shadow:none}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--track)}
.item:last-child{border:0}
.chk{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--a);flex:none;background:none;padding:0;color:#fff;font-size:15px;box-shadow:none}
.chk.on{background:linear-gradient(135deg,#10b981,#06b6d4);border-color:transparent;animation:pop .35s}
@keyframes pop{50%{transform:scale(1.35)}}
.done{text-decoration:line-through;color:var(--mut)}
.bar{height:12px;background:var(--track);border-radius:8px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b));border-radius:8px;transition:width .5s}
.big{font-size:60px;font-weight:800;text-align:center;margin:6px 0;background:linear-gradient(135deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.cen{text-align:center}
.cups{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:12px 0}
.cup{font-size:32px;filter:grayscale(1);opacity:.3;transition:.3s}.cup.on{filter:none;opacity:1;transform:scale(1.1)}
.rings{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.rc{margin:0;padding:14px 4px;text-align:center}
.rc small{display:block;color:var(--mut)}
.rw{position:relative;width:84px;height:84px;margin:0 auto 8px}
.rw span{position:absolute;inset:0;display:grid;place-items:center;font-size:28px}

try{const r=localStorage.getItem(K);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}

const day=(o=0)=>{const d=new Date();d.setDate(d.getDate()-o);return d.toLocaleDateString('sv')};
let T=day();
if(S.water.d!==T)S.water={d:T,n:0};

function streak(h){let n=0,o=h.days.includes(T)?0:1;while(h.days.includes(day(o))){n++;o++}return n}

function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}

function render(){

  const C={home:['#6366f1','#ec4899'],tasks:['#6366f1','#8b5cf6'],water:['#06b6d4','#3b82f6'],shop:['#10b981','#06b6d4'],fin:['#10b981','#3b82f6'],habits:['#f59e0b','#ef4444'],focus:['#ec4899','#8b5cf6']}[tab];
  document.documentElement.style.setProperty('--a',C[0]);document.documentElement.style.setProperty('--b',C[1]);
  if(tab==='home'){
    const tl=tasksFor(T),dn=tl.filter(x=>x.done[T]).length,hd=S.habits.filter(h=>h.days.includes(T)).length;

    v.innerHTML=`<div class="row"><div class="grow"><h1>${hello()}!</h1><p class="sub">📅 ${dateUz()}</p></div><button class="g" onclick="togSnd()" style="font-size:20px">${S.snd?'🔊':'🔇'}</button></div>

    <div class="card"><h2>Kayfiyatingiz qanday?</h2><div class="moods">${MO.map((m,i)=>`<button class="mo ${S.mood[T]===i?'on':''}" onclick="setM(${i})">${m}</button>`).join('')}</div><div class="week">${[6,5,4,3,2,1,0].map(o=>{const k=day(o),x=S.mood[k];return `<span>${x!=null?MO[x]:'·'}<small>${k.slice(8)}</small></span>`}).join('')}</div></div>
    <div class="card"><div class="row"><h2 class="grow" style="margin:0">💡 Kun maslahati</h2><button class="g" onclick="tipO++;render()">🔄 Yana</button></div><p style="margin:10px 0 0">${TIPS[(Math.floor(Date.now()/864e5)+tipO)%TIPS.length]}</p></div>

    <div class="card"><h2>⚙️ Sozlamalar</h2><div class="row"><span class="grow">🔊 Ovoz</span><button class="g" onclick="togSnd()">${S.snd?'Yoqilgan':'O\'chiq'}</button></div><div class="row" style="margin-top:12px"><span class="grow">🎨 Mavzu</span>${[['auto','Avto'],['light','☀️'],['dark','🌙']].map(x=>`<button class="chip ${S.th===x[0]?'sel':''}" onclick="setTh('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="row" style="margin-top:12px"><span class="grow">🔒 PIN-kod<br><small style="color:var(--mut)">${S.pin?'Yoqilgan':'Ixtiyoriy, qo\'yish shart emas'}</small></span><button class="g" onclick="pinSet()">${S.pin?'O\'zgartirish':'Qo\'yish'}</button>${S.pin?'<button class="g" onclick="pinOff()">O\'chirish</button>':''}</div></div>`;
  }else if(tab==='tasks'){
    const ws=weekStart(),days=[0,1,2,3,4,5,6].map(i=>addDays(ws,i)),list=tasksFor(fTD),dn=list.filter(t=>t.done[fTD]).length;
    let wt=0,wd=0;days.filter(k=>k<=T).forEach(k=>{const l=tasksFor(k);wt+=l.length;wd+=l.filter(t=>t.done[k]).length});
    v.innerHTML=`<h1>Vazifalar</h1><p class="sub">Shu hafta: ${wd}/${wt} bajarildi</p>
    <div class="week2">${days.map((k,i)=>`<button class="wd ${k===fTD?'sel':''} ${k===T?'td':''}" onclick="setTD('${k}')">${DN[i]}<b>${+k.slice(8)}</b><i class="${tasksFor(k).length?'dt':''}"></i></button>`).join('')}</div>
    <div class="card"><input type="text" id="ti" placeholder="Yangi vazifa..." onkeydown="if(event.key==='Enter')addT()">

  }else if(tab==='shop'){

const DN=['Du','Se','Ch','Pa','Ju','Sh','Ya'];
const wdOf=k=>(new Date(k+'T00:00:00').getDay()+6)%7;
const addDays=(k,n)=>{const d=new Date(k+'T00:00:00');d.setDate(d.getDate()+n);return d.toLocaleDateString('sv')};
const weekStart=()=>addDays(T,-wdOf(T));
const tasksFor=k=>S.tasks.filter(t=>k>=(t.from||'0')&&(t.date?t.date===k:t.days.includes(wdOf(k)))).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'));
const repL=t=>t.date?'Bir marta':t.days.length===7?'Har kuni':t.days.map(i=>DN[i]).join(', ');
let fTD=T,fD=[],fOnce=true;
function paintD(){const q=fOnce?'once':fD.length===7?'all':(fD.join()==='0,1,2,3,4')?'wk':(fD.join()==='5,6')?'we':'';document.querySelectorAll('.dq').forEach(b=>b.classList.toggle('sel',b.dataset.q===q));document.querySelectorAll('.dch').forEach(b=>b.classList.toggle('sel',!fOnce&&fD.includes(+b.dataset.i)))}
function qd(q){fOnce=q==='once';fD=q==='all'?[0,1,2,3,4,5,6]:q==='wk'?[0,1,2,3,4]:q==='we'?[5,6]:[];paintD()}
function togD(i){fOnce=false;const k=fD.indexOf(i);k>-1?fD.splice(k,1):fD.push(i);fD.sort();paintD()}

function togT(id){const t=S.tasks.find(x=>x.id===id);t.done[fTD]=!t.done[fTD];sfx(t.done[fTD]?'ok':'tap');save();render()}
function delT(id){S.tasks=S.tasks.filter(x=>x.id!==id);sfx('del');save();render()}
function toast(m){const e=document.createElement('div');e.className='toast';e.textContent=m;e.onclick=()=>e.remove();document.body.appendChild(e);setTimeout(()=>e.remove(),8000)}
const notified=new Set();
function remind(){const n=new Date(),hm=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');tasksFor(T).forEach(t=>{const key=T+t.id+hm;if(t.time===hm&&!t.done[T]&&!notified.has(key)){notified.add(key);toast('⏰ '+t.t);sfx('done');try{navigator.vibrate&&navigator.vibrate([200,100,200]);'Notification' in window&&Notification.permission==='granted'&&new Notification('Qulay Kun',{body:t.t})}catch(e){}}})}
setInterval(remind,15000);

applyTh();
const pinH=x=>{let h=5381;for(const c of 'qk'+x+'9z')h=((h<<5)+h+c.charCodeAt(0))|0;return String(h)};
function pad(title,cb,cancel,forgot){const o=document.createElement('div');o.className='ov lk';let c='',msg='';document.body.appendChild(o);
  const api={close:()=>o.remove(),title:t=>{title=t;msg=''},err:m=>{msg=m||'Noto\'g\'ri PIN';o.classList.remove('shk');void o.offsetWidth;o.classList.add('shk');try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}sfx('del')}};
  const draw=()=>{o.innerHTML=`<h1>${title}</h1><p class="sub" style="min-height:22px;color:#ef4444">${msg}</p><div class="dots">${[0,1,2,3].map(i=>`<i class="${i<c.length?'on':''}"></i>`).join('')}</div><div class="kp">${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>k===''?'<span></span>':`<button class="g" data-k="${k}">${k}</button>`).join('')}</div>${cancel?'<button class="x" id="pc">Bekor qilish</button>':''}${forgot?'<button class="x" id="pf">PIN-kodni unutdim</button>':''}`;
    o.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='⌫')c=c.slice(0,-1);else if(c.length<4)c+=k;msg='';draw();if(c.length===4)setTimeout(()=>{const code=c;c='';cb(code,api);if(o.isConnected)draw()},120)});
    const pc=o.querySelector('#pc');if(pc)pc.onclick=()=>o.remove();const pf=o.querySelector('#pf');if(pf)pf.onclick=()=>forgot(o,draw)};
  draw()}
let locked=false,hid=0;
function lock(){if(!S.pin||locked)return;locked=true;pad('PIN-kodni kiriting',(c,api)=>{if(pinH(c)===S.pin){locked=false;sfx('ok');api.close()}else api.err()},false,(o,back)=>{o.innerHTML='<h1>Ma\'lumotlar o\'chadi</h1><p class="sub">PIN unutilgan bo\'lsa, ilovani qayta tiklash uchun barcha ma\'lumotlar o\'chiriladi.</p><button id="fy">Ha, o\'chirish</button><br><button class="g" id="fn2">Yo\'q, orqaga</button>';$('#fy').onclick=()=>{try{localStorage.removeItem(K)}catch(e){}location.reload()};$('#fn2').onclick=back})}
function newPin(){let first=null;pad('Yangi PIN (4 raqam)',(c,api)=>{if(!first){first=c;api.title('PIN-ni qayta kiriting')}else if(c===first){S.pin=pinH(c);save();sfx('ok');api.close();render()}else{first=null;api.title('Yangi PIN (4 raqam)');api.err('Mos kelmadi, qaytadan kiriting')}},true)}
function pinSet(){if(S.pin)pad('Joriy PIN-kod',(c,api)=>{if(pinH(c)===S.pin){api.close();newPin()}else api.err()},true);else newPin()}
function pinOff(){pad('PIN-ni o\'chirish: joriy kod',(c,api)=>{if(pinH(c)===S.pin){S.pin='';save();sfx('ok');api.close();render()}else api.err()},true)}
